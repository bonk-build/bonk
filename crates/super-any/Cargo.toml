[package]
name = "super-any"
version = "0.1.0"
edition = "2024"

[dependencies]
dyn-eq = { version = "0.1", optional = true }
dyn-hash = { version = "1", optional = true }
serde = { version = "1", optional = true }
erased-serde = { version = "0.4", optional = true }

[features]
default = ["eq", "hash", "serde-ser"]
eq = ["dep:dyn-eq"]
hash = ["dep:dyn-hash"]
serde-ser = ["dep:serde", "dep:erased-serde"]

[dev-dependencies]
serde_json = "1"
