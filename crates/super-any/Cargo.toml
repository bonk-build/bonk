[package]
name = "super-any"
version = "0.1.0"
edition = "2024"

[dependencies]
dyn-eq = { version = "0.1.3", optional = true }
dyn-hash = { version = "1.0.0", optional = true }
erased-serde = { version = "0.4.10", optional = true }
serde = { version = "1.0.229", optional = true }

[features]
default = ["eq", "hash", "serde"]
eq = ["dep:dyn-eq"]
hash = ["dep:dyn-hash"]
serde-ser = ["dep:serde", "dep:erased-serde"]
serde-de = ["dep:serde", "dep:erased-serde"]
serde = ["serde-ser", "serde-de"]

[dev-dependencies]
serde_json = "1.0.154"
