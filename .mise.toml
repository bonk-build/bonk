[settings]
experimental = true
all_compile = false

[env]
CGO_ENABLED = 1

[tools]
# Build tools
go = "1.26.5"
buf = "1.73.0"
"github:vektra/mockery" = "3.8.0"
# Developer tools
golangci-lint = "2.12.2"
"github:fast/hawkeye" = "latest"

[tasks]
generate.run = "go generate ./..."
build.run = "go build ./..."
test.run = "go test ./... -race -count 100 -parallel 8"
lint.run = ["golangci-lint fmt", "golangci-lint run", "hawkeye format"]
